name: keepalive

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  HEARTBEAT_AFTER_DAYS: 45

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Re-enable the deploy schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/enable"
          echo "deploy workflow enabled"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Push a heartbeat commit when the repo has been quiet
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last commit ${age_days} days ago"
          if (( age_days < HEARTBEAT_AFTER_DAYS )); then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keep the deploy schedule active"
          git push
          echo "heartbeat pushed"
